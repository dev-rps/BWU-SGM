services:
  - type: web
    name: safety-guardian-ml
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: ml_model
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
